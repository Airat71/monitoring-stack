name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-stack:
    name: Validate Docker Compose + Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet
        working-directory: prometheus-grafana

      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus-grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus-grafana/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

  validate-yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse YAML files
        run: |
          python3 -m pip install --user pyyaml -q
          python3 << 'PY'
          import sys
          from pathlib import Path
          import yaml
          skip = {".git", ".github", "grafana-dashboards"}
          errors = []
          for p in Path(".").rglob("*.yml"):
              if any(part in skip for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print("OK", p)
              except yaml.YAMLError as e:
                  errors.append(f"FAIL {p}: {e}")
          for p in Path(".").rglob("*.yaml"):
              if any(part in skip for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print("OK", p)
              except yaml.YAMLError as e:
                  errors.append(f"FAIL {p}: {e}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning
