name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-stack:
    name: Validate (Docker Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose config
        run: docker compose config --quiet
        working-directory: prometheus-grafana
        env:
          # Parse-only value. The published stack still refuses to start without a real password.
          GRAFANA_PASSWORD: ci-validation-only

      - name: Check shipped dashboards match the builder
        run: |
          python3 scripts/build-dashboards.py
          git diff --exit-code -- grafana-dashboards/json

      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus-grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus-grafana/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

  validate-yaml:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse YAML files
        run: |
          python3 -m pip install --user pyyaml -q
          python3 << 'PY'
          import sys
          from pathlib import Path
          import yaml
          skip = {".git", ".github", "grafana-dashboards"}
          errors = []
          for p in Path(".").rglob("*.yml"):
              if any(part in skip for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print("OK", p)
              except yaml.YAMLError as e:
                  errors.append(f"FAIL {p}: {e}")
          for p in Path(".").rglob("*.yaml"):
              if any(part in skip for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print("OK", p)
              except yaml.YAMLError as e:
                  errors.append(f"FAIL {p}: {e}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

  ci-pass:
    name: CI passed
    runs-on: ubuntu-24.04
    needs: [validate-stack, validate-yaml, shellcheck]
    if: always()
    steps:
      - name: All CI jobs passed or skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
