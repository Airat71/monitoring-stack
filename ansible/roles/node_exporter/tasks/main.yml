---
# PRO: install Node Exporter on monitored nodes (for multi-server scraping)
# Option A: Docker container (like FREE stack)
# Option B: systemd service (binary) — better for nodes that don't run Docker

- name: Create node exporter directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir | default('/opt/node_exporter') }}"
    state: directory
    mode: "0755"

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version | default('1.7.0') }}/node_exporter-{{ node_exporter_version | default('1.7.0') }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter.tar.gz"
    mode: "0644"
  when: node_exporter_install_method | default('docker') != 'docker'

- name: Unarchive Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version | default('1.7.0') }}.linux-amd64/node_exporter"
  when: node_exporter_install_method | default('docker') != 'docker'

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version | default('1.7.0') }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_install_dir | default('/opt/node_exporter') }}/node_exporter"
    mode: "0755"
    remote_src: true
  when: node_exporter_install_method | default('docker') != 'docker'

- name: Create systemd unit for Node Exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/node_exporter.service"
    mode: "0644"
  when: node_exporter_install_method | default('docker') != 'docker'

- name: Enable and start Node Exporter (systemd)
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  when: node_exporter_install_method | default('docker') != 'docker'

# Option: run via Docker on node (simpler if node already has Docker)
- name: Run Node Exporter container
  community.docker.docker_container:
    name: node-exporter
    image: "prom/node-exporter:{{ node_exporter_version | default('v1.7.0') }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "127.0.0.1:{{ node_exporter_port | default(9100) }}:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
  when: node_exporter_install_method | default('docker') == 'docker'
