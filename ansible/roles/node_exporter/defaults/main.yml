node_exporter_version: "1.12.1"
node_exporter_port: 9100
node_exporter_install_dir: /opt/node_exporter
node_exporter_install_method: docker
# sha256 of the official release archives for node_exporter_version (sha256sums.txt of the release).
# Update both values together with node_exporter_version.
node_exporter_checksums:
  amd64: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
  arm64: "sha256:ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
# IP Prometheus opens. Override when ansible_host is not that address.
node_exporter_bind_ip: "{{ ansible_host }}"
