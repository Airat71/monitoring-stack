---
# Deploy the monitoring stack (Prometheus, Grafana, Alertmanager, Node Exporter, Blackbox)
# Assumes Docker and Docker Compose are installed (add a role or pre-requisite if needed)

- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ monitoring_base_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - grafana/provisioning/dashboards
    - grafana/provisioning/dashboards/json
    - grafana/provisioning/datasources
  loop_control:
    label: "{{ item or 'root' }}"

- name: Deploy Grafana datasource (Prometheus)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ monitoring_base_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"

- name: Deploy Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboards-provider.yml.j2
    dest: "{{ monitoring_base_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    mode: "0644"

- name: Stat dashboard JSON dir (controller)
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../grafana-dashboards/json"
  register: dashboard_json_dir_stat
  delegate_to: localhost
  run_once: true

- name: Copy Grafana dashboard JSON folder
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../grafana-dashboards/json/"
    dest: "{{ monitoring_base_dir }}/grafana/provisioning/dashboards/json"
    mode: "0644"
  when: dashboard_json_dir_stat.stat.exists | default(false)

- name: Copy docker-compose for the monitoring stack
  ansible.builtin.template:
    src: docker-compose.pro.yml.j2
    dest: "{{ monitoring_base_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_base_dir }}/prometheus.yml"
    mode: "0644"

- name: Copy alert rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus-grafana/alerts.yml"
    dest: "{{ monitoring_base_dir }}/alerts.yml"
    mode: "0644"

- name: Copy Blackbox config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus-grafana/blackbox.yml"
    dest: "{{ monitoring_base_dir }}/blackbox.yml"
    mode: "0644"

- name: Check Telegram settings before writing Alertmanager config
  ansible.builtin.assert:
    that:
      - telegram_bot_token is defined
      - telegram_chat_id is defined
      - telegram_bot_token | length > 0
      - telegram_chat_id | string is match('^[0-9]+$')
    fail_msg: "Set both telegram_bot_token and a numeric telegram_chat_id, or leave both unset. Store the token in Ansible Vault."
  when: telegram_bot_token is defined or telegram_chat_id is defined
  no_log: true

- name: Copy Alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_base_dir }}/alertmanager.yml"
    mode: "0644"
  when: deploy_alertmanager | default(true) | bool
  no_log: true

- name: Validate Prometheus config (promtool)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - promtool
      - -v
      - "{{ monitoring_base_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - -v
      - "{{ monitoring_base_dir }}/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "{{ prometheus_image | default('prom/prometheus:v3.14.0') }}"
      - check
      - config
      - /etc/prometheus/prometheus.yml
  register: promtool_config
  changed_when: false
  failed_when: promtool_config.rc != 0

- name: Validate Prometheus alert rules (promtool)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - promtool
      - -v
      - "{{ monitoring_base_dir }}/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "{{ prometheus_image | default('prom/prometheus:v3.14.0') }}"
      - check
      - rules
      - /etc/prometheus/alerts.yml
  register: promtool_rules
  changed_when: false
  failed_when: promtool_rules.rc != 0

- name: Validate Alertmanager config
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - amtool
      - -v
      - "{{ monitoring_base_dir }}/alertmanager.yml:/tmp/alertmanager.yml:ro"
      - "{{ alertmanager_image | default('prom/alertmanager:v0.34.1') }}"
      - check-config
      - /tmp/alertmanager.yml
  register: amtool_config
  changed_when: false
  failed_when: amtool_config.rc != 0
  no_log: true
  when: deploy_alertmanager | default(true) | bool

- name: Ensure .env exists from example
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus-grafana/.env.example"
    dest: "{{ monitoring_base_dir }}/.env"
    mode: "0600"
    force: false
  when: skip_env_create is not defined or not skip_env_create

- name: Read Grafana password from .env
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - '/^GRAFANA_PASSWORD=/{print substr($0, index($0,"=")+1)}'
      - "{{ monitoring_base_dir }}/.env"
  register: grafana_password_file
  changed_when: false
  no_log: true

- name: Generate Grafana admin password when .env has none
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=24') }}"
    grafana_password_generated: true
  when:
    - grafana_admin_password is not defined
    - (grafana_password_file.stdout | trim) | length == 0
  no_log: true

- name: Store Grafana admin password
  ansible.builtin.lineinfile:
    path: "{{ monitoring_base_dir }}/.env"
    regexp: '^GRAFANA_PASSWORD='
    line: "GRAFANA_PASSWORD={{ grafana_admin_password }}"
    mode: "0600"
  when:
    - grafana_admin_password is defined
    - (grafana_password_file.stdout | trim) | length == 0
  no_log: true

- name: Show generated Grafana admin password
  ansible.builtin.debug:
    msg: "Grafana admin user is admin. Password generated for this install: {{ grafana_admin_password }}. It is stored in {{ monitoring_base_dir }}/.env and is not changed on the next run."
  when: grafana_password_generated | default(false)

- name: Start monitoring stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ monitoring_base_dir }}"
  register: compose_up
  changed_when: "'Creating' in compose_up.stdout or 'Starting' in compose_up.stdout or 'Recreating' in compose_up.stdout or 'Pull' in compose_up.stdout"

- name: Wait for Prometheus
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9090
    delay: 3
    timeout: 90

- name: Reload Prometheus configuration
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/reload
    method: POST
    status_code: [200, 204]

- name: Include backup script and cron (optional)
  ansible.builtin.include_tasks: backup.yml
  when: deploy_backup_script | default(false) | bool
